<div class="bg-white rounded-2xl p-5 shadow-sm">
  <div class="flex justify-between items-center mb-4">
    <h2 class="font-bold text-gray-700">카테고리</h2>
    <button
      (click)="isAdding.set(!isAdding())"
      class="w-8 h-8 roundedfull bg-indigo-500 text-white text-xl flex items-center justify-center"
    >
      {{ isAdding() ? 'X' : '+' }}
    </button>
  </div>

  @if (isAdding()) {
    <div class="mb-4 p-4 bg-gray-50 rounded-xl flex flex-col gap-3">
      <div>
        <label class="text-xs text-gray-400 mb-1 block">아이콘</label>
        <div class="flex flex-wrap gap-2">
          @for (icon of iconOptions; track icon) {
            <button
              (click)="newIcon.set(icon)"
              [class]="
                newIcon() === icon
                  ? 'w-9 h-9 rounded-lg bg-indigo-100 text-lg border-2 border-indigo-400'
                  : 'w-9 h-9 rounded-lg bg-white text-lg border-2 border-gray-200'
              "
            >
              {{ icon }}
            </button>
          }
        </div>
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">이름</label>
        <input
          type="text"
          [(ngModel)]="newName"
          name="newName"
          placeholder="카테고리 이름"
          class="w-full px-3 py-2 rounded-lg border-2 border-gray-200 focus:outline-none focus:border-indigo-400 text-sm"
        />
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">색상</label>
        <input
          type="color"
          [(ngModel)]="newColor"
          name="newColor"
          placeholder="카테고리 이름"
          class="w-10 h-10 rounded-lg border-2 border-gray-200 cursor-pointer"
        />
      </div>

      <button
        (click)="add()"
        class="w-full py-2 bg-indigo-500 text-white rounded-lg text-sm font-semibold"
      >
        추가
      </button>
    </div>
  }

  <div class="flex flex-col gap-2">
    @for (cat of budgetService.categories(); track cat.id) {
      <div class="flex items-center gap-3">
        <a [routerLink]="['category', cat.id]" class="flex-1 flex items-center gap-3">
          <span
            class="w-9 h-9 rounded-full flex items-center justify-center text-lg"
            [style.background-color]="cat.color + '22'"
          >
            {{ cat.icon }}</span
          >
          <span class="text-sm font-medium text-gray-700">{{ cat.name }}</span>
        </a>

        <button
          (click)="budgetService.deleteCategory(cat.id)"
          class="text-gray-300 hover:text-red-400 transition text-sm"
        >
          🗑
        </button>
      </div>
    }
  </div>
</div>
