<div class="bg-white rounded-2xl p-5 shadow-sm">
  <div class="flex gap-2 mb-4">
    <button
      (click)="type.set('expense')"
      [class]="
        type() === 'expense'
          ? 'flex-1 py-2 rounded-xl text-sm font-bold bg-red-500 text-white transition'
          : 'flex-1 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-400 transition'
      "
    >
      지출
    </button>
    <button
      (click)="type.set('income')"
      [class]="
        type() === 'income'
          ? 'flex-1 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-white transition'
          : 'flex-1 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-400 transition'
      "
    >
      수입
    </button>
  </div>

  <div class="mb-3">
    <label class="text-xs text-gray-400 mb-1 block">금액</label>
    <input
      type="number"
      [(ngModel)]="amount"
      name="amount"
      placeholder="0"
      class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:outline-none fpcus:border-indigo-400 text-sm"
    />
  </div>

  <div class="mb-3">
    <label class="text-xs text-gray-400 mb-1 block">내용</label>
    <input
      type="text"
      [(ngModel)]="description"
      name="description"
      placeholder="무엇에 썼나요?"
      class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:outline-none fpcus:border-indigo-400 text-sm"
    />
  </div>

  <div class="mb-3">
    <label class="text-xs text-gray-400 mb-1 block">카테고리</label>
    <div class="flex flex-wrap gap-2">
      @for (cat of budgetService.categories(); track cat.id) {
        <button
          (click)="categoryId.set(cat.id)"
          [class]="
            categoryId() === cat.id
              ? 'px-3 py-1.5 rounded-full text-xs font-semibold text-white transition'
              : 'px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-500 transition'
          "
          [style.background-color]="categoryId() === cat.id ? cat.color : ''"
        >
          {{ cat.icon }} {{ cat.name }}
        </button>
      }
    </div>
  </div>

  <div class="mb-3">
    <label class="text-xs text-gray-400 mb-1 block">날짜</label>
    <input
      type="date"
      [(ngModel)]="date"
      name="date"
      class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:outline-none fpcus:border-indigo-400 text-sm"
    />
  </div>

  <button
    (click)="submit()"
    class="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold text-sm transition"
  >
    저장
  </button>
</div>
