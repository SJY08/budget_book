      [class.text-primary]="isActive('/analytics')"
      [class.text-text-tertiary]="!isActive('/analytics')"

        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
