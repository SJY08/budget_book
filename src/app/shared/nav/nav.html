<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 shadow-lg z-50">
  <div class="max-w-md mx-auth flex">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        class="flex-1 flex flex-col items-center py-3 gap-1 transition"
        [class]="isActive(item.path) ? 'text-indigo-500' : 'text-gray-400 hover:text-gray-600'"
      >
        <span class="text-2xl">{{ item.icon }}</span>
        <span class="text-xs font-medium">{{ item.label }}</span>
      </a>
    }
  </div>
</nav>
