<div
  class="flex flex-col min-h-full bg-background pb-20"
  swipeable
  (swipeLeft)="onSwipeLeft()"
  (swipeRight)="onSwipeRight()"
>
  <div #header class="bg-surface px-6 pt-12 pb-4 rounded-b-3xl shadow-sm sticky top-0 z-10">
    <h1 class="text-2xl font-bold text-text-primary">카테고리 관리</h1>
    <p class="text-text-secondary mt-1 mb-5">지출과 수입을 분류할 카테고리를 설정하세요.</p>
    <div class="flex bg-gray-100 rounded-lg p-1">
      <button
        (click)="switchTab('expense', 'right')"
        [class]="
          activeTab() === 'expense'
            ? 'flex-1 py-2 rounded-md text-sm font-medium bg-white shadow-sm text-danger transition-all'
            : 'flex-1 py-2 rounded-md text-sm font-medium text-text-secondary transition-all'
        "
      >
        지출
      </button>
      <button
        (click)="switchTab('income', 'left')"
        [class]="
          activeTab() === 'income'
            ? 'flex-1 py-2 rounded-md text-sm font-medium bg-white shadow-sm text-success transition-all'
            : 'flex-1 py-2 rounded-md text-sm font-medium text-text-secondary transition-all'
        "
      >
        수입
      </button>
    </div>
  </div>

  <div class="p-5 space-y-4">
    <button
      #addBtn
      (click)="openAdd()"
      class="w-full bg-white border-2 border-dashed border-gray-200 rounded-2xl p-4 flex items-center justify-center gap-2 text-text-secondary hover:border-primary hover:text-primary transition-colors"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" x2="12" y1="5" y2="19" />
        <line x1="5" x2="19" y1="12" y2="12" />
      </svg>
      <span class="font-medium"
        >새 {{ activeTab() === 'expense' ? '지출' : '수입' }} 카테고리 추가</span
      >
    </button>

    <!-- 탭 콘텐츠 애니메이션 -->
    <div
      #tabContent
      [class]="
        swipeDir() === 'left'
          ? 'grid grid-cols-2 gap-4 tab-slide-left'
          : swipeDir() === 'right'
            ? 'grid grid-cols-2 gap-4 tab-slide-right'
            : 'grid grid-cols-2 gap-4'
      "
    >
      @for (cat of filteredCategories(); track cat.id) {
        <div
          #catCard
          class="bg-surface rounded-2xl p-5 shadow-soft flex flex-col items-center text-center relative"
        >
          <a [routerLink]="['/category', cat.id]" class="flex flex-col items-center">
            <app-category-icon [iconName]="cat.iconName" [color]="cat.color" [size]="26" />
            <h3 class="font-bold text-text-primary mt-3">{{ cat.name }}</h3>
          </a>
          <button
            (click)="deleteCategory(cat.id, cat.name)"
            class="absolute top-3 right-3 p-1.5 bg-gray-100 rounded-full text-text-tertiary hover:text-danger transition-all"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
            </svg>
          </button>
        </div>
      }
    </div>
  </div>

  @if (isAdding()) {
    <div
      class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm"
      (click)="closeAdd()"
    >
      <div
        #modal
        class="bg-surface w-full max-w-md rounded-t-3xl p-6 pb-24 max-h-[90vh] overflow-y-auto"
        (click)="$event.stopPropagation()"
      >
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-bold">새 카테고리</h2>
            <p class="text-sm text-text-secondary mt-0.5">
              {{ activeTab() === 'expense' ? '지출' : '수입' }} 카테고리
            </p>
          </div>
          <button (click)="closeAdd()" class="p-2 bg-gray-100 rounded-full text-text-secondary">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" x2="6" y1="6" y2="18" />
              <line x1="6" x2="18" y1="6" y2="18" />
            </svg>
          </button>
        </div>

        <div class="space-y-6">
          <div class="flex gap-4 items-center">
            <app-category-icon [iconName]="newIcon()" [color]="newColor()" [size]="28" />
            <input
              type="text"
              [(ngModel)]="newName"
              name="newName"
              placeholder="카테고리 이름"
              class="flex-1 bg-gray-50 border-none rounded-xl p-4 text-lg font-bold focus:ring-2 focus:ring-primary outline-none"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-text-secondary mb-2">아이콘 선택</label>
            <div class="grid grid-cols-6 gap-2">
              @for (icon of iconOptions; track icon) {
                <button
                  (click)="newIcon.set(icon)"
                  [class]="
                    newIcon() === icon
                      ? 'h-10 rounded-full flex items-center justify-center bg-primary/10 text-primary ring-2 ring-primary'
                      : 'h-10 rounded-full flex items-center justify-center bg-gray-50 text-text-secondary hover:bg-gray-100'
                  "
                >
                  <app-category-icon
                    [iconName]="icon"
                    [color]="newIcon() === icon ? '#3182f6' : '#8b95a1'"
                    [size]="16"
                  />
                </button>
              }
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-text-secondary mb-2">색상 선택</label>
            <div class="flex flex-wrap gap-3">
              @for (color of colorOptions; track color) {
                <button
                  (click)="newColor.set(color)"
                  class="w-8 h-8 rounded-full transition-transform"
                  [class.scale-125]="newColor() === color"
                  [style.background-color]="color"
                ></button>
              }
            </div>
          </div>

          <button
            (click)="add()"
            [disabled]="!newName().trim()"
            class="w-full bg-primary text-white font-bold py-4 rounded-xl disabled:opacity-50 mt-4"
          >
            추가하기
          </button>
        </div>
      </div>
    </div>
  }
</div>
