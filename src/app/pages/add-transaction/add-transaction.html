<div class="flex flex-col min-h-screen bg-surface">
  <div
    class="flex items-center justify-between p-4 border-b border-gray-100 sticky top-0 bg-surface z-10"
  >
    <button (click)="goBack()" class="p-2 -ml-2 text-text-primary">
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>

    <div class="flex bg-gray-100 rounded-lg p-1">
      <button
        (click)="handleTypeChange('expense')"
        [class]="
          type() === 'expense'
            ? 'px-4 py-1.5 rounded-md text-sm font-medium bg-white shadow-sm text-danger transition-colors'
            : 'px-4 py-1.5 rounded-md text-sm font-medium text-text-secondary transition-colors'
        "
      >
        지출
      </button>
      <button
        (click)="handleTypeChange('income')"
        [class]="
          type() === 'income'
            ? 'px-4 py-1.5 rounded-md text-sm font-medium bg-white shadow-sm text-success transition-colors'
            : 'px-4 py-1.5 rounded-md text-sm font-medium text-text-secondary transition-colors'
        "
      >
        수입
      </button>
    </div>

    <div class="w-10"></div>
  </div>

  <div class="flex-1 overflow-y-auto px-6 py-8 space-y-8">
    <div #section class="text-center">
      <p class="text-text-tertiary mb-3 font-medium">
        {{ type() === 'expense' ? '얼마를 쓰셨나요?' : '얼마를 받으셨나요?' }}
      </p>
      <input
        type="text"
        inputmode="numeric"
        placeholder="0"
        autofocus
        (input)="handleAmountChange($event)"
        [class]="
          'w-full text-center text-5xl font-bold tracking-tight bg-transparent border-none outline-none placeholder:text-gray-300 ' +
          (amount() === 0 ? 'text-gray-300' : type() === 'expense' ? 'text-danger' : 'text-success')
        "
      />
      <p class="text-text-tertiary text-lg font-medium mt-1">원</p>
    </div>

    <div #section>
      <label class="block text-sm font-medium text-text-secondary mb-3">카테고리</label>
      @if (filteredCategories().length === 0) {
        <div class="bg-gray-50 rounded-xl p-6 text-center text-text-tertiary text-sm">
          {{ type() === 'expense' ? '지출' : '수입' }} 카테고리가 없습니다.
        </div>
      } @else {
        <div class="grid grid-cols-4 gap-3">
          @for (cat of filteredCategories(); track cat.id) {
            <button
              (click)="categoryId.set(cat.id)"
              [class]="
                categoryId() === cat.id
                  ? 'flex flex-col items-center gap-2 p-3 rounded-xl bg-primary/10 ring-2 ring-primary transition-all'
                  : 'flex flex-col items-center gap-2 p-3 rounded-xl bg-gray-50 hover:bg-gray-100 transition-all'
              "
            >
              <app-category-icon [iconName]="cat.iconName" [color]="cat.color" [size]="20" />
              <span class="text-xs font-medium text-text-primary">{{ cat.name }}</span>
            </button>
          }
        </div>
      }
    </div>

    <div #section>
      <label class="block text-sm font-medium text-text-secondary mb-2">날짜</label>
      <input
        type="date"
        [(ngModel)]="date"
        name="date"
        class="w-full bg-gray-50 border-none rounded-xl p-4 text-text-primary font-medium focus:ring-2 focus:ring-primary outline-none"
      />
    </div>

    <div #section>
      <label class="block text-sm font-medium text-text-secondary mb-2">메모 (선택)</label>
      <input
        type="text"
        [(ngModel)]="memo"
        name="memo"
        placeholder="어디서 쓰셨나요?"
        class="w-full bg-gray-50 border-none rounded-xl p-4 text-text-primary focus:ring-2 focus:ring-primary outline-none"
      />
    </div>
  </div>

  <div class="sticky bottom-0 bg-surface border-t border-gray-100 p-4">
    <button
      (click)="save()"
      [disabled]="!canSave()"
      class="w-full bg-primary text-white font-bold text-lg py-4 rounded-xl transition-colors shadow-lg shadow-primary/20 disabled:opacity-50 disabled:bg-gray-300"
    >
      저장하기
    </button>
  </div>
</div>
